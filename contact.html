<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Vuqa</title>
  <meta name="description" content="Contact Vuqa for a demo of our POS, lending or school management systems.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>

  <section class="page-hero" style="background-image:linear-gradient(90deg,rgba(6,36,31,.92),rgba(6,36,31,.6)),url(images/contact.jpg),linear-gradient(135deg,#0f5c4d,#06241f)">
    <p class="tag">Contact</p>
    <h1>Let us set up your demo.</h1>
    <p class="lead">Send us a message and we will reply as soon as we can.</p>
  </section>

  <section class="section contact-grid">
    <form id="contact-form" class="form">
      <label>Your name<input name="name" required autocomplete="name"></label>
      <label>Phone number<input name="phone" type="tel" required autocomplete="tel"></label>
      <label>I am interested in<select name="interest"></select></label>
      <label>Message<textarea name="message" rows="4" placeholder="Tell us a little about your business"></textarea></label>
      <button class="btn" type="submit">Send via WhatsApp</button>
      <small>This opens WhatsApp with your message ready to send.</small>
    </form>
    <div class="info">
      <h3>Talk to us directly</h3>
      <p><strong>Phone / WhatsApp</strong><br><a href="tel:+254728440292">+254 728 440 292</a></p>
      <p><strong>Email</strong><br><a href="mailto:vuqasystems@gmail.com">vuqasystems@gmail.com</a></p>
      <p><strong>Website</strong><br>vuqa.co.ke</p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/systems.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
